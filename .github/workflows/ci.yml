name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_NOISEBOUND_NETWORK: ${{ vars.NEXT_PUBLIC_NOISEBOUND_NETWORK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_NOISEBOUND_NETWORK: ${{ vars.NEXT_PUBLIC_NOISEBOUND_NETWORK }}

      - name: Test
        run: pnpm test
